# Development: `docker compose up -d` starts Qdrant and Ollama only.
# Production:  `docker compose --profile prod up -d --build` also starts the app.
#
# Qdrant and Ollama have no authentication here, so their ports are bound to
# 127.0.0.1 and never exposed to the internet; the app reaches them by name.
services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"      # REST API
      - "127.0.0.1:6334:6334"      # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Optional cross-encoder reranker. Start with --profile rerank and set
  # RERANK_URL (http://localhost:8081 in development, http://reranker for the app).
  # Measured on the eval set (eval/RESULTS.md): on CPU bge-reranker-v2-m3 takes
  # about 60 s per question, so only enable it on a GPU host (use the matching
  # cuda image tag). Smaller CPU-friendly rerankers scored worse than hybrid
  # search alone.
  reranker:
    profiles: ["rerank"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    # Smaller batches keep CPU warm-up and memory reasonable; passages are
    # chunk-sized, so truncating at 1024 tokens loses nothing.
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--max-batch-tokens", "4096", "--auto-truncate"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - reranker_data:/data

  app:
    profiles: ["prod"]
    build: .
    restart: unless-stopped
    depends_on: [qdrant, ollama]
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      PORT: "8080"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app_data:/app/data

volumes:
  qdrant_data:
  ollama_data:
  app_data:
  reranker_data:
