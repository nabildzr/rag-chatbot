# Development: `docker compose up -d` starts Qdrant and Ollama only.
# Production:  `docker compose --profile prod up -d --build` also starts the app.
#
# Qdrant and Ollama have no authentication here, so their ports are bound to
# 127.0.0.1 and never exposed to the internet; the app reaches them by name.
services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"      # REST API
      - "127.0.0.1:6334:6334"      # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  app:
    profiles: ["prod"]
    build: .
    restart: unless-stopped
    depends_on: [qdrant, ollama]
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      PORT: "8080"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app_data:/app/data

volumes:
  qdrant_data:
  ollama_data:
  app_data:
