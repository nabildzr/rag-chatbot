# Live reload for the Go API during development: `air` (https://github.com/air-verse/air)
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api.exe ./cmd/api"
  entrypoint = ["./tmp/api.exe"]
  include_ext = ["go"]
  include_file = [".env"]
  exclude_dir = ["tmp", "bin", "web", "docs", ".git"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  kill_delay = "1s"
  send_interrupt = false
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
